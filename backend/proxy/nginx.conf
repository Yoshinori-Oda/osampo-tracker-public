# リバースプロキシ(nginx)の設定。TLSを終端してHTTPSで公開し、/api/ だけをapiへ転送する。
# 設計と各値の理由は backend/docs/HTTPSとリバースプロキシ.md。開発環境のための構成(本番はクラウドのサービスに置き換える想定)。

worker_processes auto;

# 公式イメージでは /var/log/nginx/*.log が標準出力・標準エラーにつながっている(docker compose logs proxy で見る)
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # 応答のServerヘッダーにnginxのバージョンを出さない
    server_tokens off;
    # proxyが自分で返す応答(エラーのJSON)の種類
    default_type application/json;

    # ---- アクセスログ ----------------------------------------------------------
    # パスは「パスの型」に置き換え、クエリ文字列は残さない(apiのアクセスログと同じ方針。user_id・session_id・同期の日時が入るため)。
    # $uri はクエリ文字列を含まない
    map $uri $log_path {
        ~^/api/users/[^/]+/sessions/existence-check$    /api/users/{user_id}/sessions/existence-check;
        ~^/api/users/[^/]+/sessions/[^/]+/restore$      /api/users/{user_id}/sessions/{session_id}/restore;
        ~^/api/users/[^/]+/sessions/[^/]+$              /api/users/{user_id}/sessions/{session_id};
        ~^/api/users/[^/]+/sessions$                    /api/users/{user_id}/sessions;
        # 型に当てはまらないパスに入ったUUID(1つ・2つ)も伏せる
        "~^(?<p1>.*?)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?<p2>.*?)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?<p3>.*)$" $p1{id}$p2{id}$p3;
        "~^(?<p1>.*?)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?<p2>.*)$" $p1{id}$p2;
        # /api/ の外を探られた等が分かるよう、それ以外はそのまま残す
        default $uri;
    }

    # apiのログと同じkey=valueの1行。時間(duration_s・upstream_s)は秒
    log_format osampo '$time_iso8601 proxy.access request request_id=$request_id ip=$remote_addr '
                      'method=$request_method path=$log_path status=$status upstream_status=$upstream_status '
                      'request_bytes=$request_length response_bytes=$bytes_sent '
                      'duration_s=$request_time upstream_s=$upstream_response_time tls=$ssl_protocol';
    access_log /var/log/nginx/access.log osampo;

    # ---- 上限 ------------------------------------------------------------------
    # 送信元のIPごとの流量。DoSを弾くためだけの値(普段の利用・CGNATで引っかからないように)
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    # パスワード・確認コードを照合・ハッシュする操作(argon2が重いので別に低く)
    limit_req_zone $binary_remote_addr zone=credentials:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    # 既定は503なので、APIの形式に合わせて429にする
    limit_req_status 429;
    limit_conn_status 429;

    # bodyの大きさ(apiの上限と同じ10MiB)
    client_max_body_size 10m;

    # ① 端末⇔proxy
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    # ② proxy⇔api
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 30s;

    # apiの名前はDockerのDNSで引き直す(apiのコンテナが作り直されてIPが変わっても、proxyを再起動せずに済むように)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        # 80番は待ち受けない。HTTP/2は有効にしない(アプリのHTTP通信はHTTP/1.1だけ)
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;

        # MozillaのSSL Configuration Generatorのintermediateに従う(nginx・OpenSSLのバージョンは公式イメージのもの)。
        # DHEの暗号スイートはDHのパラメータ(ssl_dhparam)を置いていないので使われない(ECDHEで足りる)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ecdh_curve X25519:prime256v1:secp384r1;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:MozSSL:10m;
        ssl_session_tickets off;

        limit_conn conn 100;

        # apiへ転送するときのヘッダー。クライアントが送った値は使わずに上書きする
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # 応答のX-Request-IDはproxyが付ける(apiの値と同じ。二重に付かないよう、apiのものは隠す)
        proxy_hide_header X-Request-ID;

        # 全ての応答(proxyが返すエラーを含む)に付けるヘッダー。add_headerはlocationで1つでも書くと
        # 外側のものを引き継がないので、ファイルにまとめて各locationでincludeする
        include /etc/nginx/security_headers.conf;

        # proxyが自分で返すエラーも、APIのエラーの形式(code・message)で返す
        error_page 400 @http_error;
        error_page 413 @payload_too_large;
        error_page 429 @too_many_requests;
        error_page 502 @bad_gateway;
        error_page 504 @gateway_timeout;

        # 公開するのは /api/ だけ
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            set $upstream http://api:8080;
            proxy_pass $upstream;
        }

        location ~ ^/api/(auth/signup|auth/login|users/me/password|users/me/email-verification|users/me/email-verification/confirm)$ {
            limit_req zone=api burst=100 nodelay;
            limit_req zone=credentials burst=10 nodelay;
            set $upstream http://api:8080;
            proxy_pass $upstream;
        }

        location / {
            return 404 '{"code":"not_found","message":"Not Found"}\n';
        }

        location @http_error {
            return 400 '{"code":"http_error","message":"Bad Request"}\n';
        }

        location @payload_too_large {
            return 413 '{"code":"payload_too_large","message":"Request body is too large"}\n';
        }

        location @too_many_requests {
            include /etc/nginx/security_headers.conf;
            add_header Retry-After 1 always;
            return 429 '{"code":"too_many_requests","message":"Too many requests"}\n';
        }

        # apiにつながらない(502)・apiの応答が時間内に来ない(504)。codeはどちらもservice_unavailable
        location @bad_gateway {
            return 502 '{"code":"service_unavailable","message":"Bad Gateway"}\n';
        }

        location @gateway_timeout {
            return 504 '{"code":"service_unavailable","message":"Gateway Timeout"}\n';
        }
    }

    # composeのhealthcheck用。コンテナの中のループバックだけで待ち受ける(ホストには公開しない)
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location = /healthz {
            return 204;
        }

        location / {
            return 404;
        }
    }
}
